<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ArchiPath Academy</title>

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="logo" href="#/"><span class="logo-mark">A</span>ArchiPath <span class="muted" style="font-weight:500">Academy</span></a>
    <form class="search" id="searchForm" role="search">
      <input id="searchInput" type="search" placeholder="Rechercher une formation, une notion (VPC, pod, pipeline…)" autocomplete="off" aria-label="Rechercher">
    </form>
    <button class="icon-btn menu-toggle" id="menuBtn" aria-label="Menu">☰</button>
    <nav class="nav" id="nav">
      <a href="#/" data-nav="/">Accueil</a>
      <a href="#/catalogue" data-nav="/catalogue">Catalogue</a>
      <a href="#/roadmap" data-nav="/roadmap">Roadmap</a>

      <a href="#/notes" data-nav="/notes">Notes</a>
      <a href="#/parametres" data-nav="/parametres" title="Paramètres">⚙️</a>
      <button class="icon-btn" id="themeBtn" title="Thème clair / sombre">🌙</button>
